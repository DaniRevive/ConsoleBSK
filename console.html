<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Console di Controllo Basket PRO - Cloud</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap');

        :root {
            --bg-main: #070a10;
            --bg-card: #0f172a;
            --border-color: #1e293b;
            --accent-home: #6366f1;
            --accent-guest: #d946ef;
            --accent-gold: #f59e0b;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0; padding: 10px; background-color: var(--bg-main);
            font-family: 'Montserrat', sans-serif; color: var(--text-main);
            display: flex; flex-direction: column; gap: 10px; box-sizing: border-box;
            max-width: 1300px; margin-left: auto; margin-right: auto;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-card); padding: 8px 15px; border-radius: 8px;
            border: 1px solid var(--border-color); flex-wrap: wrap; gap: 10px;
        }
        header h1 { margin: 0; font-size: 15px; font-weight: 900; color: var(--accent-gold); }

        .connection-status {
            background: #030712; padding: 6px 12px; border-radius: 6px;
            border: 1px solid var(--border-color); font-size: 11px; display: flex; align-items: center; gap: 8px;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
        .status-dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px;
        }
        .card-title {
            font-size: 11px; font-weight: 900; text-transform: uppercase; color: var(--text-muted);
            border-bottom: 1px solid var(--border-color); padding-bottom: 4px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .team-config-row { display: flex; gap: 5px; }
        .team-input-group { display: flex; gap: 4px; flex: 1; }
        .team-input-group input {
            flex: 1; background: #030712; border: 1px solid var(--border-color);
            color: #fff; padding: 6px 8px; border-radius: 4px; font-weight: 700; font-size: 12px; outline: none;
        }
        .btn-apply-team {
            background: var(--accent-gold); color: #030712; border: none; padding: 0 10px;
            border-radius: 4px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 10px;
        }

        .control-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .btn {
            background: #1e293b; color: #fff; border: 1px solid rgba(255,255,255,0.06);
            padding: 8px; border-radius: 4px; font-weight: 900; font-size: 11px; cursor: pointer;
            text-transform: uppercase;
        }
        .btn:hover { filter: brightness(1.2); }
        .btn:active { transform: scale(0.98); }

        .btn-home { background: var(--accent-home); }
        .btn-guest { background: var(--accent-guest); }
        .btn-danger { background: var(--accent-red); }
        .btn-warning { background: var(--accent-gold); color: #030712; }
        .btn-time { background: #3b82f6; }

        .btn-big-timer {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000; font-size: 12px; font-weight: 900; padding: 12px;
            border-radius: 6px; border: none; cursor: pointer; text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        .global-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .pos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .pos-btn { background: #334155; font-size: 9px; padding: 8px 2px; text-align: center; }

        .ads-controls-box { display: flex; gap: 8px; width: 100%; }
    </style>
</head>
<body>

    <header>
        <h1>CONSOLE BASKET PRO</h1>
        <div class="connection-status">
            <div id="dot" class="status-dot"></div>
            <span>ID Stanza OBS: <strong id="peer-id-display" style="color:var(--accent-gold);">Connessione...</strong></span>
        </div>
        <div style="display: flex; gap: 6px;">
            <button class="btn btn-warning" onclick="sendCmd('show_score|toggle')">MOSTRA/NASCONDI</button>
            <button class="btn btn-time" onclick="toggleTimeVisibility()">TEMPO</button>
            <button class="btn btn-danger" onclick="sendCmd('rf')">AZZERA FALLI</button>
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="card" style="border-top: 3px solid var(--accent-home);">
            <div class="card-title">Casa: <span id="lbl-title-h" style="color:var(--accent-home)">CASA</span></div>
            <div class="team-config-row">
                <div class="team-input-group">
                    <input type="text" id="input-team-h" value="CASA" placeholder="Nome Squadra">
                    <button class="btn-apply-team" onclick="updateTeamName('h')">OK</button>
                </div>
            </div>
            <div class="control-row">
                <button class="btn btn-home" onclick="sendCmd('h1')">+1 Pts</button>
                <button class="btn btn-home" onclick="sendCmd('h2')">+2 Pts</button>
                <button class="btn btn-home" onclick="sendCmd('h3')">+3 Pts</button>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px;">
                <button class="btn btn-home" onclick="sendCmd('hf')">+ Fallo</button>
                <button class="btn btn-danger" onclick="sendCmd('h-f')">- Fallo</button>
                <button class="btn" style="background:#1e293b;" onclick="sendCmd('h-1')">-1 Punto</button>
            </div>
        </div>

        <div class="card" style="border-top: 3px solid var(--accent-guest);">
            <div class="card-title">Ospiti: <span id="lbl-title-g" style="color:var(--accent-guest)">OSPITI</span></div>
            <div class="team-config-row">
                <div class="team-input-group">
                    <input type="text" id="input-team-g" value="OSPITI" placeholder="Nome Squadra">
                    <button class="btn-apply-team" onclick="updateTeamName('g')">OK</button>
                </div>
            </div>
            <div class="control-row">
                <button class="btn btn-guest" onclick="sendCmd('g1')">+1 Pts</button>
                <button class="btn btn-guest" onclick="sendCmd('g2')">+2 Pts</button>
                <button class="btn btn-guest" onclick="sendCmd('g3')">+3 Pts</button>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px;">
                <button class="btn btn-guest" onclick="sendCmd('gf')">+ Fallo</button>
                <button class="btn btn-danger" onclick="sendCmd('g-f')">- Fallo</button>
                <button class="btn" style="background:#1e293b;" onclick="sendCmd('g-1')">-1 Punto</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Gestione Gara</div>
            <button class="btn-big-timer" onclick="sendCmd('toggle')">
                <span>▶ / ❚❚</span> AVVIA / STOP <small style="font-size: 9px; opacity: 0.8;">[SPAZIO]</small>
            </button>
            <div class="control-row">
                <button class="btn" style="background:#1e293b;" onclick="sendCmd('reset_time')">RESET 10M</button>
                <button class="btn btn-warning" onclick="sendCmd('period')">QUARTO</button>
                <button class="btn btn-danger" onclick="sendCmd('hide_ad')">CHIUDI ADV</button>
            </div>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
        <div class="card">
            <div class="card-title">Schermate TV & Posizione Scorebug</div>
            <div class="global-actions">
                <button class="btn" style="background:#1e293b;" onclick="sendCmd('show_waiting')">In Attesa</button>
                <button class="btn" style="background:#1e293b;" onclick="sendCmd('show_coming_back')">Tra Poco</button>
                <button class="btn" style="background:#1e293b;" onclick="sendCmd('show_start')">Inizio</button>
                <button class="btn" style="background:#1e293b;" onclick="sendCmd('show_end')">Fine</button>
            </div>
            <div class="pos-grid">
                <button class="btn pos-btn" onclick="sendCmd('set_position|pos-top-left')">SX Alto</button>
                <button class="btn pos-btn" onclick="sendCmd('set_position|pos-top-center')">Centro Alto</button>
                <button class="btn pos-btn" onclick="sendCmd('set_position|pos-top-right')">DX Alto</button>
                <button class="btn pos-btn" onclick="sendCmd('set_position|pos-bottom-left')">SX Basso</button>
                <button class="btn pos-btn" onclick="sendCmd('set_position|pos-bottom-center')">Centro Basso</button>
                <button class="btn pos-btn" onclick="sendCmd('set_position|pos-bottom-right')">DX Basso</button>
            </div>
        </div>

        <div class="card" style="justify-content: center;">
            <div class="card-title">Rotazione Automatica Sponsor (1 - 24)</div>
            <div class="ads-controls-box">
                <button class="btn btn-warning" style="flex: 2; padding: 12px; font-size: 11px;" onclick="sendCmd('toggle_ads_rotation')">▶ AVVIA / FERMA ROTAZIONE</button>
                <button class="btn btn-danger" style="flex: 1; padding: 12px; font-size: 11px;" onclick="sendCmd('hide_ad')">CHIUDI ADV</button>
            </div>
        </div>
    </div>

    <script>
        let timeVisible = true;
        let activeConn = null;

        // Configurazione STUN server pubblici per superare i blocchi di rete su dispositivi diversi
        const peerOptions = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        };

        const roomId = "BSK-" + Math.floor(1000 + Math.random() * 9000);
        const peer = new Peer(roomId, peerOptions);

        peer.on('open', (id) => {
            document.getElementById('peer-id-display').innerText = id;
        });

        peer.on('connection', (conn) => {
            activeConn = conn;
            document.getElementById('dot').classList.add('online');
        });

        function toggleTimeVisibility() {
            timeVisible = !timeVisible;
            sendCmd(timeVisible ? 'show_time|on' : 'show_time|off');
        }

        document.addEventListener('keydown', function(e) {
            const activeElement = document.activeElement;
            if (e.code === 'Space' && activeElement.tagName !== 'INPUT' && activeElement.tagName !== 'TEXTAREA') {
                e.preventDefault();
                sendCmd('toggle');
            }
        });

        function sendCmd(cmd) {
            const data = { cmd: cmd };
            if (activeConn && activeConn.open) {
                activeConn.send(data);
            }
            localStorage.setItem('basket_event', JSON.stringify({ cmd: cmd, t: Date.now() }));
        }

        function updateTeamName(type) {
            const val = document.getElementById(`input-team-${type}`).value.trim();
            document.getElementById(`lbl-title-${type}`).innerText = val.toUpperCase();
            sendCmd(`${type === 'h' ? 'nh' : 'ng'}|` + val);
        }
    </script>
</body>
</html>
