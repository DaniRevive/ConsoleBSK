<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Basket PRO</title>
    <!-- PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #121212; color: #fff; }
        .btn { padding: 12px 20px; margin: 8px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-action { background: #2ed573; color: white; }
        .btn-score { background: #38bdf8; color: black; }
        .btn-hide { background: #ff4757; color: white; }
        #status { font-weight: bold; margin-top: 15px; font-size: 18px; }
        input { padding: 10px; font-size: 14px; width: 90%; margin: 10px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; text-align: center; }
        .section { background: #1e1e1e; padding: 15px; margin: 15px 0; border-radius: 10px; }
    </style>
</head>
<body>
    <h2>Console Basket PRO</h2>
    
    <div class="section">
        <p style="margin:0; font-size: 14px; color: #aaa;">Link fisso per OBS:</p>
        <input type="text" id="overlayUrl" readonly>
        <div id="status" style="color: #ffa500;">In attesa di connessione da OBS...</div>
    </div>

    <div class="section">
        <h3>Comandi Rapidi Punteggio</h3>
        <button class="btn btn-score" onclick="sendCommand('h1')">Casa +1</button>
        <button class="btn btn-score" onclick="sendCommand('h2')">Casa +2</button>
        <button class="btn btn-score" onclick="sendCommand('h3')">Casa +3</button>
        <br>
        <button class="btn btn-score" onclick="sendCommand('g1')">Ospiti +1</button>
        <button class="btn btn-score" onclick="sendCommand('g2')">Ospiti +2</button>
        <button class="btn btn-score" onclick="sendCommand('g3')">Ospiti +3</button>
    </div>

    <div class="section">
        <h3>Gestione Controlli</h3>
        <button class="btn btn-action" onclick="sendCommand('toggle')">Avvia / Ferma Tempo</button>
        <button class="btn btn-action" onclick="sendCommand('period')">Cambia Quarto</button>
        <button class="btn btn-hide" onclick="sendCommand('show_waiting')">Schermata Attesa</button>
    </div>

    <!-- Script di connessione PeerJS con ID Fisso -->
    <script>
        const roomId = 'basket-console-123'; 
        
        const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
        const overlayFullUrl = `${baseUrl}/grafica.html?room=${roomId}`;
        
        document.getElementById('overlayUrl').value = overlayFullUrl;

        const peer = new Peer(roomId);
        let activeConn = null;

        peer.on('open', (id) => {
            console.log('Console pronta con ID fisso:', id);
        });

        peer.on('connection', (conn) => {
            activeConn = conn;
            document.getElementById('status').innerText = '✅ Connesso all\'Overlay (OBS)!';
            document.getElementById('status').style.color = '#2ed573';

            conn.on('close', () => {
                document.getElementById('status').innerText = '❌ Overlay disconnesso';
                document.getElementById('status').style.color = '#ff4757';
                activeConn = null;
            });
        });

        function sendCommand(cmd) {
            if (activeConn && activeConn.open) {
                activeConn.send({ cmd: cmd });
            } else {
                alert('Nessun overlay connesso ad OBS! Verifica che la fonte browser sia attiva.');
            }
        }
    </script>
</body>
</html>
