<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Grafica Basket PRO - TV Overlay</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,900;1,900&family=Share+Tech+Mono&display=swap');
        
        :root {
            --foul-color: #f59e0b;     
            --accent-cyan: #38bdf8;
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            --text-gate-bg: rgba(255, 255, 255, 0.04);
            --bg-dark-grad: linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(3, 7, 18, 0.98));
            --bug-bottom: 60px;
            --bug-left: 80px;
            --bug-right: 80px;
            --bug-top: 60px;
            --ad-edge-offset: 40px;
            --ad-right-offset: 60px;
        }

        body { 
            margin: 0; width: 1920px; height: 1080px; 
            overflow: hidden; background: transparent; 
            font-family: 'Montserrat', sans-serif; color: var(--text-main); 
        }

        .scaler-container {
            transform: scale(0.9); 
            width: 1920px; height: 1080px; position: absolute; 
            top: 0; left: 0; pointer-events: none;
        }

        body.pos-bottom-left .scaler-container { transform-origin: bottom left; }
        body.pos-bottom-center .scaler-container { transform-origin: bottom center; }
        body.pos-bottom-right .scaler-container { transform-origin: bottom right; }
        body.pos-top-left .scaler-container { transform-origin: top left; }
        body.pos-top-center .scaler-container { transform-origin: top center; }
        body.pos-top-right .scaler-container { transform-origin: top right; }

        @keyframes loading-smooth {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }

        @keyframes tv-glow-score {
            0% { transform: scale(1); text-shadow: 0 0 0 transparent; color: #ffffff; }
            30% { transform: scale(1.35); color: var(--accent-cyan); text-shadow: 0 0 30px rgba(56, 189, 248, 1); }
            100% { transform: scale(1); text-shadow: 0 0 0 transparent; color: #ffffff; }
        }

        @keyframes bonus-blink-5-times {
            0% { color: #ffffff; background-color: #dc2626; box-shadow: 0 0 20px rgba(220, 38, 38, 1), inset 0 0 10px rgba(255, 255, 255, 0.6); transform: scale(1.08); }
            50% { color: rgba(255,255,255,0.3); background-color: rgba(15, 23, 42, 0.9); box-shadow: 0 0 0 transparent; transform: scale(1); }
            100% { color: #ffffff; background-color: #dc2626; box-shadow: 0 0 20px rgba(220, 38, 38, 1), inset 0 0 10px rgba(255, 255, 255, 0.6); transform: scale(1.08); }
        }

        .bonus-flashing {
            animation: bonus-blink-5-times 0.6s ease 5;
            animation-fill-mode: forwards;
        }

        .scorebug-main {
            position: absolute;
            left: var(--bug-left);
            bottom: var(--bug-bottom);
            height: 74px;
            display: flex; align-items: center;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.85));
            transition: left 0.4s ease, right 0.4s ease, top 0.4s ease, bottom 0.4s ease, transform 0.4s ease;
        }

        .team-box-home {
            height: 70px;
            background: var(--home-bg, linear-gradient(135deg, #1e293b 0%, #0f172a 100%));
            border-left: 6px solid var(--home-border, #38bdf8);
            display: flex; align-items: center; padding: 0 24px 0 20px;
            transform: skewX(-15deg); box-sizing: border-box; position: relative; z-index: 2;
            border-top: 2px solid var(--home-border-top, rgba(56, 189, 248, 0.4));
            border-bottom: 2px solid rgba(0,0,0,0.8);
            box-shadow: inset 0 2px 10px var(--home-shadow, rgba(56, 189, 248, 0.2));
        }
        .team-box-home-inner { transform: skewX(15deg); display: flex; align-items: center; gap: 16px; }
        .team-name-h { font-size: 24px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: #ffffff; max-width: 220px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
        .team-logo-h { width: 52px; height: 52px; object-fit: contain; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.7)); display: block !important; }

        .score-center-split { height: 78px; display: flex; align-items: center; position: relative; z-index: 5; margin: 0 -14px; }
        .score-panel-home { height: 76px; width: 88px; background: linear-gradient(135deg, #0f172a 0%, #030712 100%); transform: skewX(-15deg); display: flex; align-items: center; justify-content: center; border-top: 2px solid var(--home-border, #38bdf8); border-bottom: 2px solid #030712; }
        .score-panel-home span { transform: skewX(15deg); font-family: 'Share Tech Mono', monospace; font-size: 44px; font-weight: 700; color: #ffffff; display: inline-block; }

        .score-divider-line { width: 6px; height: 84px; background: linear-gradient(to bottom, var(--foul-color), #ffffff, var(--accent-cyan)); transform: skewX(-15deg); z-index: 6; }

        .score-panel-guest { height: 76px; width: 88px; background: linear-gradient(135deg, #0f172a 0%, #030712 100%); transform: skewX(-15deg); display: flex; align-items: center; justify-content: center; border-top: 2px solid var(--guest-border, #f59e0b); border-bottom: 2px solid #030712; }
        .score-panel-guest span { transform: skewX(15deg); font-family: 'Share Tech Mono', monospace; font-size: 44px; font-weight: 700; color: #ffffff; display: inline-block; }

        .team-box-guest {
            height: 70px;
            background: var(--guest-bg, linear-gradient(135deg, #1e293b 0%, #0f172a 100%));
            border-right: 6px solid var(--guest-border, #f59e0b);
            display: flex; align-items: center; padding: 0 20px 0 24px;
            transform: skewX(-15deg); box-sizing: border-box; position: relative; z-index: 2;
            border-top: 2px solid var(--guest-border-top, rgba(245, 158, 11, 0.4));
            border-bottom: 2px solid rgba(0,0,0,0.8);
            box-shadow: inset 0 2px 10px var(--guest-shadow, rgba(245, 158, 11, 0.2));
        }
        .team-box-guest-inner { transform: skewX(15deg); display: flex; align-items: center; gap: 16px; }
        .team-name-g { font-size: 24px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: #ffffff; max-width: 220px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
        .team-logo-g { width: 52px; height: 52px; object-fit: contain; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.7)); display: block !important; }

        .extra-info-bar {
            position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%); width: 420px; height: 32px;
            background: var(--bg-dark-grad); border: 1px solid rgba(255,255,255,0.18); border-radius: 6px;
            display: flex; align-items: center; justify-content: space-around; padding: 0 15px;
            font-family: 'Share Tech Mono', monospace; font-size: 15px; font-weight: 700; z-index: 4;
        }
        .extra-info-item { display: flex; align-items: center; gap: 6px; }
        .extra-label { font-size: 10px; font-family: 'Montserrat', sans-serif; font-weight: 900; color: #94a3b8; }

        .bonus-badge-home, .bonus-badge-guest {
            position: absolute; top: -24px; font-size: 9px; font-family: 'Montserrat', sans-serif; font-weight: 900;
            color: #64748b; padding: 3px 10px; background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 4px; letter-spacing: 1.5px; opacity: 0.35; z-index: 3;
        }
        .bonus-badge-home { left: 20px; }
        .bonus-badge-guest { right: 20px; }
        .bonus-badge-home.active, .bonus-badge-guest.active { opacity: 1; color: #ffffff; background-color: #dc2626; box-shadow: 0 0 15px rgba(220, 38, 38, 0.9); border-color: #fca5a5; }

        body.pos-bottom-left .scorebug-main { left: var(--bug-left); bottom: var(--bug-bottom); }
        body.pos-bottom-center .scorebug-main { left: 50%; bottom: var(--bug-bottom); transform: translateX(-50%); }
        body.pos-bottom-right .scorebug-main { left: auto; right: var(--bug-right); bottom: var(--bug-bottom); }
        body.pos-top-left .scorebug-main { left: var(--bug-left); top: var(--bug-top); }
        body.pos-top-center .scorebug-main { left: 50%; top: var(--bug-top); transform: translateX(-50%); }
        body.pos-top-right .scorebug-main { left: auto; right: var(--bug-right); top: var(--bug-top); }

        #ad-graphic-container {
            position: fixed; height: 150px; width: 220px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-top: 2px solid rgba(245, 158, 11, 0.4); border-bottom: 2px solid rgba(0,0,0,0.8);
            border-right: 6px solid var(--foul-color);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 8px 10px;
            box-sizing: border-box; z-index: 9998; opacity: 0; pointer-events: none;
            transform: skewX(-15deg); transition: opacity 0.4s ease;
            right: var(--ad-right-offset); bottom: var(--ad-edge-offset);
        }

        #ad-graphic-container.active { opacity: 1; pointer-events: auto; }

        .ad-title-tag {
            transform: skewX(15deg); font-size: 10px; font-weight: 900; letter-spacing: 2px;
            color: var(--foul-color); text-transform: uppercase; border-bottom: 1px solid rgba(245, 158, 11, 0.3);
            width: 100%; text-align: center; padding-bottom: 3px; margin-bottom: 6px;
        }

        .ad-content-wrapper { transform: skewX(15deg); display: flex; align-items: center; justify-content: center; flex: 1; width: 100%; overflow: hidden; }
        #ad-image-display { width: 100%; height: 100%; object-fit: contain; }

        .full-screen-gate { position: fixed; inset: 0; background: #030712; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.5s; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .full-screen-gate.active { opacity: 1; pointer-events: all; }
        .gate-watermark-text { position: absolute; font-size: 200px; font-weight: 900; color: var(--text-gate-bg); text-transform: uppercase; user-select: none; z-index: 1; }
        .gate-main-layout { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        
        .match-row { display: flex; gap: 100px; align-items: center; justify-content: center; margin-bottom: 50px; }
        .match-row img { width: 200px; height: 200px; object-fit: contain; }
        .gate-team-name { font-size: 40px; font-weight: 900; margin-top: 20px; color: #fff; max-width: 440px; line-height: 1.2; text-align: center; text-transform: uppercase; }
        .gate-title-main { font-size: 80px; font-weight: 900; margin-bottom: 25px; }
        .gate-score-val { font-size: 138px; margin: 0; font-family: 'Share Tech Mono', monospace; }

        .modern-bar-container { width: 450px; height: 6px; background: rgba(255,255,255,0.1); margin: 30px auto 0 auto; border-radius: 3px; position: relative; overflow: hidden; }
        .loader-progress { width: 40%; height: 100%; background: var(--foul-color); position: absolute; animation: loading-smooth 1.8s infinite cubic-bezier(0.65, 0, 0.35, 1); }
        .three-pointer { animation: tv-glow-score 1.5s cubic-bezier(0.25, 1, 0.5, 1); }
        .hide-scoreboard { display: none !important; }
    </style>
</head>
<body class="pos-bottom-center">

    <div id="ad-graphic-container">
        <div class="ad-title-tag">SPONSOR UFFICIALE</div>
        <div class="ad-content-wrapper"><img id="ad-image-display" src="" alt="Pubblicità"></div>
    </div>

    <div id="gate-waiting" class="full-screen-gate">
        <div class="gate-watermark-text">LIVE STREAM</div>
        <div class="gate-main-layout">
            <h1 style="color:var(--foul-color); font-size:75px; margin:0 0 10px 0; font-weight:900;">LIVE STREAMING</h1>
            <h2 style="font-size:32px; color:white; text-transform: uppercase; margin:0;">La diretta sta per iniziare...</h2>
            <div class="modern-bar-container"><div class="loader-progress"></div></div>
        </div>
    </div>

    <div id="gate-coming-back" class="full-screen-gate">
        <div class="gate-watermark-text">BRK</div>
        <div class="gate-main-layout">
            <h1 style="color:var(--foul-color); font-size:75px; margin:0 0 10px 0; font-weight:900;">STIAMO TORNANDO</h1>
            <h2 style="font-size:32px; color:white; text-transform: uppercase; margin:0;">Le partite riprenderanno a breve...</h2>
            <div class="modern-bar-container"><div class="loader-progress"></div></div>
        </div>
    </div>

    <div id="gate-start" class="full-screen-gate">
        <div class="gate-watermark-text">MATCHDAY</div>
        <div class="gate-main-layout">
            <h1 class="gate-title-main" style="color:var(--foul-color);">INIZIO PARTITA</h1>
            <div class="match-row">
                <div style="display:flex; flex-direction:column; align-items:center;"><img id="st-lh"><div id="st-nh" class="gate-team-name"></div></div>
                <div style="font-size:80px; font-weight:900; color:#64748b;">VS</div>
                <div style="display:flex; flex-direction:column; align-items:center;"><img id="st-lg"><div id="st-ng" class="gate-team-name"></div></div>
            </div>
        </div>
    </div>

    <div id="gate-end" class="full-screen-gate">
        <div class="gate-watermark-text">FINAL SCORE</div>
        <div class="gate-main-layout">
            <h1 class="gate-title-main" style="color:var(--foul-color);">RISULTATO FINALE</h1>
            <div class="match-row">
                <div style="display:flex; flex-direction:column; align-items:center;"><img id="en-lh"><div id="en-nh" class="gate-team-name" style="font-size:32px; color:#94a3b8;"></div><h2 id="en-sh" class="gate-score-val">0</h2></div>
                <div style="font-size:100px; color:#64748b;">-</div>
                <div style="display:flex; flex-direction:column; align-items:center;"><img id="en-lg"><div id="en-ng" class="gate-team-name" style="font-size:32px; color:#94a3b8;"></div><h2 id="en-sg" class="gate-score-val">0</h2></div>
            </div>
        </div>
    </div>

    <div id="overlay-switch" class="full-screen-gate">
        <div class="gate-watermark-text">NEXT PERIOD</div>
        <div class="gate-main-layout">
            <h1 id="sw-text" style="font-size:85px; color:var(--foul-color); font-weight:900; margin-bottom:25px;"></h1>
            <div class="match-row">
                <div style="display:flex; flex-direction:column; align-items:center;"><img id="sw-lh"><div id="sw-nh" class="gate-team-name"></div></div>
                <div style="font-size:55px; color:#64748b;">VS</div>
                <div style="display:flex; flex-direction:column; align-items:center;"><img id="sw-lg"><div id="sw-ng" class="gate-team-name"></div></div>
            </div>
        </div>
    </div>

    <div class="scaler-container" style="pointer-events: auto;">
        <div class="scorebug-main" id="scorebug-main-container">
            <div class="team-box-home" id="team-box-home-el">
                <div id="bonus-lbl-home" class="bonus-badge-home">BONUS</div>
                <div class="team-box-home-inner">
                    <span id="nh" class="team-name-h">CASA</span>
                    <img id="lh" class="team-logo-h" src="" onerror="this.style.display='none'">
                </div>
            </div>

            <div class="score-center-split">
                <div class="score-panel-home"><span id="sh">0</span></div>
                <div class="score-divider-line"></div>
                <div class="score-panel-guest"><span id="sg">0</span></div>
            </div>

            <div class="team-box-guest" id="team-box-guest-el">
                <div id="bonus-lbl-guest" class="bonus-badge-guest">BONUS</div>
                <div class="team-box-guest-inner">
                    <img id="lg" class="team-logo-g" src="" onerror="this.style.display='none'">
                    <span id="ng" class="team-name-g">OSPITI</span>
                </div>
            </div>

            <div class="extra-info-bar">
                <div id="time-container-wrapper" class="extra-info-item"><span class="extra-label">TIME</span><span id="clock" style="color:#ffffff;">10:00</span></div>
                <div class="extra-info-item"><span class="extra-label">QUARTER</span><span id="period" style="color:var(--foul-color);">1</span></div>
                <div class="extra-info-item"><span class="extra-label">FOULS</span><span><span id="fh-num" style="color:var(--accent-cyan);">0</span> - <span id="fg-num" style="color:var(--foul-color);">0</span></span></div>
            </div>
        </div>
    </div>

    <script>
        const logoPath = 'loghi/'; 
        const ext = '.png';        

        let sH = 0, sG = 0, fH = 0, fG = 0, time = 600, running = false, pIdx = 0;
        let lastBonusStateH = false, lastBonusStateG = false;
        let currentHomeFull = "CASA", currentGuestFull = "OSPITI"; 
        const periods = ["1°", "2°", "3°", "4°", "OT"], pFull = ["1° QUARTO", "2° QUARTO", "3° QUARTO", "4° QUARTO", "OVERTIME"];

        let adsRotationInterval = null;
        let currentAdIndex = 1;
        const totalAds = 15;
        const adDisplayDurationSeconds = 6; 

        let timerThreeH = null;
        let timerThreeG = null;
        let scoreboardVisible = true;

        const peerOptions = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        };

        // ID fisso generato per la grafica OBS in modo che sia subito identificabile
        const fixedObsId = "BSK-OBS-" + Math.floor(1000 + Math.random() * 9000);
        const peer = new Peer(fixedObsId, peerOptions);

        peer.on('open', (id) => {
            console.log("ID Grafica OBS attivo:", id);
        });

        peer.on('connection', (conn) => {
            conn.on('data', (data) => {
                if (data && data.cmd) handleCommand(data.cmd);
            });
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'basket_event' && e.newValue) {
                handleCommand(JSON.parse(e.newValue).cmd);
            }
        });

        function formatTeamName(fullName) {
            if (!fullName) return "";
            let cleanName = fullName.trim();
            let words = cleanName.split(/\s+/);
            if (words.length >= 2) {
                return `${words[0].substring(0, 1).toUpperCase()}. ${words.slice(1).join(" ").toUpperCase()}`;
            }
            return cleanName.toUpperCase();
        }

        function handleCommand(msg) {
            let parts = msg.split('|');
            let cmd = parts[0], val = parts[1];
            
            if (cmd === 'set_position') {
                document.body.className = '';
                if(val) document.body.classList.add(val);
            }
            if (cmd === 'show_score') {
                const sc = document.querySelector('.scaler-container');
                if (val === 'toggle') {
                    scoreboardVisible = !scoreboardVisible;
                    val = scoreboardVisible ? 'on' : 'off';
                }
                val === 'off' ? sc.classList.add('hide-scoreboard') : sc.classList.remove('hide-scoreboard');
            }
            
            if (cmd === 'show_time') {
                const timeWrapper = document.getElementById('time-container-wrapper');
                if (timeWrapper) {
                    timeWrapper.style.visibility = (val === 'on') ? 'visible' : 'hidden';
                    timeWrapper.style.opacity = (val === 'on') ? '1' : '0';
                }
            }

            if (cmd === 'toggle_ads_rotation') {
                const adContainer = document.getElementById('ad-graphic-container');
                if (adsRotationInterval) {
                    clearInterval(adsRotationInterval);
                    adsRotationInterval = null;
                    adContainer.classList.remove('active');
                } else {
                    currentAdIndex = 1;
                    showAndRotateAd();
                    adsRotationInterval = setInterval(showAndRotateAd, adDisplayDurationSeconds * 1000);
                }
            }

            if (cmd === 'hide_ad') {
                if (adsRotationInterval) {
                    clearInterval(adsRotationInterval);
                    adsRotationInterval = null;
                }
                document.getElementById('ad-graphic-container').classList.remove('active');
            }
            
            if (cmd === 'h1') sH++; 
            if (cmd === 'h2') sH += 2; 
            if (cmd === 'h3') { sH += 3; triggerThreePointerEffect('h'); }
            if (cmd === 'g1') sG++; 
            if (cmd === 'g2') sG += 2; 
            if (cmd === 'g3') { sG += 3; triggerThreePointerEffect('g'); }
            
            if (cmd === 'h-1') sH = Math.max(0, sH-1); 
            if (cmd === 'g-1') sG = Math.max(0, sG-1);
            if (cmd === 'hf') fH++; 
            if (cmd === 'h-f') fH = Math.max(0, fH-1);
            if (cmd === 'gf') fG++; 
            if (cmd === 'g-f') fG = Math.max(0, fG-1);
            if (cmd === 'rf') { fH = 0; fG = 0; lastBonusStateH = false; lastBonusStateG = false; }
            if (cmd === 'toggle') running = !running;
            if (cmd === 'reset_time') { time = 600; running = false; }
            if (cmd === 'show_waiting') document.getElementById('gate-waiting').classList.toggle('active');
            if (cmd === 'show_coming_back') document.getElementById('gate-coming-back').classList.toggle('active');
            if (cmd === 'show_start') toggleGate('gate-start');
            if (cmd === 'show_end') toggleGate('gate-end', true);
            if (cmd === 'period') { pIdx = (pIdx + 1) % 5; time = 600; fH = 0; fG = 0; lastBonusStateH = false; lastBonusStateG = false; running = false; showTransition(); }
            
            if (cmd === 'nh') {
                currentHomeFull = val.toUpperCase(); 
                const displayName = formatTeamName(val);
                document.getElementById('nh').innerText = displayName;
                const imgEl = document.getElementById('lh');
                imgEl.style.display = 'block';
                imgEl.src = logoPath + val.toUpperCase() + ext;
            }
            if (cmd === 'ng') {
                currentGuestFull = val.toUpperCase(); 
                const displayName = formatTeamName(val);
                document.getElementById('ng').innerText = displayName;
                const imgEl = document.getElementById('lg');
                imgEl.style.display = 'block';
                imgEl.src = logoPath + val.toUpperCase() + ext;
            }
            updateUI();
        }

        function triggerThreePointerEffect(team) {
            const elId = team === 'h' ? 'sh' : 'sg';
            const el = document.getElementById(elId);
            
            if (team === 'h') { if (timerThreeH) clearTimeout(timerThreeH); }
            else { if (timerThreeG) clearTimeout(timerThreeG); }

            el.innerText = "+3";
            el.classList.remove('three-pointer');
            void el.offsetWidth;
            el.classList.add('three-pointer');

            const timer = setTimeout(() => {
                el.innerText = team === 'h' ? sH : sG;
                el.classList.remove('three-pointer');
            }, 1500);

            if (team === 'h') timerThreeH = timer;
            else timerThreeG = timer;
        }

        function showAndRotateAd() {
            const adContainer = document.getElementById('ad-graphic-container');
            const adImage = document.getElementById('ad-image-display');
            adImage.src = `${logoPath}${currentAdIndex}${ext}`;
            adContainer.classList.add('active');
            currentAdIndex = (currentAdIndex % totalAds) + 1;
        }

        function toggleGate(id, result = false) {
            const gate = document.getElementById(id);
            const lh = document.getElementById('lh').src, lg = document.getElementById('lg').src;
            if (id === 'gate-start') {
                document.getElementById('st-lh').src = lh; document.getElementById('st-lg').src = lg;
                document.getElementById('st-nh').innerText = currentHomeFull; 
                document.getElementById('st-ng').innerText = currentGuestFull;
            }
            if (result) {
                document.getElementById('en-lh').src = lh; document.getElementById('en-lg').src = lg;
                document.getElementById('en-nh').innerText = currentHomeFull; 
                document.getElementById('en-ng').innerText = currentGuestFull;
                document.getElementById('en-sh').innerText = sH; document.getElementById('en-sg').innerText = sG;
            }
            gate.classList.toggle('active');
        }

        function showTransition() {
            document.getElementById('sw-lh').src = document.getElementById('lh').src;
            document.getElementById('sw-lg').src = document.getElementById('lg').src;
            document.getElementById('sw-nh').innerText = currentHomeFull;
            document.getElementById('sw-ng').innerText = currentGuestFull;
            document.getElementById('sw-text').innerText = pFull[pIdx];
            const sw = document.getElementById('overlay-switch'); 
            sw.classList.add('active'); 
            setTimeout(() => sw.classList.remove('active'), 4000);
        }

        function updateUI() {
            const elH = document.getElementById('sh');
            const elG = document.getElementById('sg');

            if (elH.innerText !== "+3") elH.innerText = sH;
            if (elG.innerText !== "+3") elG.innerText = sG;

            document.getElementById('fh-num').innerText = fH;
            document.getElementById('fg-num').innerText = fG;
            let m = Math.floor(time / 60), s = time % 60;
            document.getElementById('clock').innerText = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
            document.getElementById('period').innerText = periods[pIdx];
            
            const bonusHome = document.getElementById('bonus-lbl-home');
            const bonusGuest = document.getElementById('bonus-lbl-guest');
            
            if (fH >= 5) {
                bonusHome.classList.add('active');
                if (!lastBonusStateH) { 
                    bonusHome.classList.remove('bonus-flashing'); 
                    void bonusHome.offsetWidth; 
                    bonusHome.classList.add('bonus-flashing'); 
                    lastBonusStateH = true; 
                }
            } else { 
                bonusHome.classList.remove('active', 'bonus-flashing'); 
                lastBonusStateH = false; 
            }

            if (fG >= 5) {
                bonusGuest.classList.add('active');
                if (!lastBonusStateG) { 
                    bonusGuest.classList.remove('bonus-flashing'); 
                    void bonusGuest.offsetWidth; 
                    bonusGuest.classList.add('bonus-flashing'); 
                    lastBonusStateG = true; 
                }
            } else { 
                bonusGuest.classList.remove('bonus-flashing', 'active'); 
                lastBonusStateG = false; 
            }
        }

        setInterval(() => {
            if (running && time > 0) { time--; updateUI(); }
        }, 1000);

        updateUI();
    </script>
</body>
</html>
