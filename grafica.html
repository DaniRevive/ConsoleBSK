<!-- PeerJS Library per ricevere i comandi dalla console mobile -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        function connectToConsole() {
            if (!roomId) return;
            
            const peer = new Peer();

            peer.on('open', () => {
                const conn = peer.connect(roomId);

                conn.on('open', () => {
                    console.log('Connesso con successo alla Console Mobile!');
                });

                conn.on('data', (data) => {
                    console.log('Comando ricevuto:', data);
                    if (data && data.cmd) {
                        handleCommand(data.cmd);
                    }
                });

                conn.on('close', () => {
                    setTimeout(connectToConsole, 3000);
                });
            });

            peer.on('error', () => {
                setTimeout(connectToConsole, 5000);
            });
        }

        connectToConsole();
    </script>
