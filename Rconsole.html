<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Console Basket PRO - Button Roster</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;900&family=Share+Tech+Mono&display=swap');

        :root {
            --bg-main: #090d16;
            --bg-card: #111827;
            --bg-elevated: #1e293b;
            --border-color: #263245;
            --accent-home: #6366f1;
            --accent-guest: #d946ef;
            --accent-gold: #f59e0b;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0 0 85px 0;
            background-color: var(--bg-main);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-main);
            user-select: none;
        }

        /* BARRA SUPERIORE FISSA */
        .sticky-top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(17, 24, 39, 0.96);
            backdrop-filter: blur(10px);
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .top-timer-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 8px;
        }

        .btn-master-timer {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            font-size: 13px;
            font-weight: 900;
            padding: 12px 6px;
            border-radius: 10px;
            border: none;
            text-transform: uppercase;
            cursor: pointer;
        }
        .btn-master-timer:active { transform: scale(0.96); }

        .btn-top-sub {
            background: var(--bg-elevated);
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-weight: 900;
            font-size: 11px;
            padding: 8px 4px;
            text-transform: uppercase;
            cursor: pointer;
        }
        .btn-top-sub.gold { background: var(--accent-gold); color: #000; border: none; }
        .btn-top-sub:active { transform: scale(0.96); }

        .tab-content {
            display: none;
            padding: 12px;
            flex-direction: column;
            gap: 12px;
        }
        .tab-content.active { display: flex; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* GRIGLIA PARTITA */
        .dual-teams-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .team-column {
            background: var(--bg-elevated);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 3px solid var(--border-color);
        }
        .team-column.home { border-top-color: var(--accent-home); }
        .team-column.guest { border-top-color: var(--accent-guest); }

        .team-col-header {
            font-size: 12px;
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-compact {
            background: #090d16;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 10px 4px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
        }
        .btn-compact:active { transform: scale(0.95); filter: brightness(1.2); }
        .btn-compact.home-bg { background: var(--accent-home); }
        .btn-compact.guest-bg { background: var(--accent-guest); }
        .btn-compact.danger-bg { background: var(--accent-red); color: #fff; }

        .grid-compact-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .grid-compact-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }

        .btn {
            background: var(--bg-elevated);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 10px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn:active { transform: scale(0.96); }
        .btn-danger { background: var(--accent-red); }
        .btn-warning { background: var(--accent-gold); color: #030712; }
        .btn-blue { background: var(--accent-blue); }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

        /* ENTRAMBI I ROSTER A GRIGLIA DI PULSANTI NELLA STESSA SCHEDA */
        .dual-rosters-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 600px) {
            .dual-rosters-grid { grid-template-columns: 1fr; }
        }

        .roster-sub-column {
            background: var(--bg-elevated);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 3px solid var(--border-color);
        }
        .roster-sub-column.home { border-top-color: var(--accent-home); }
        .roster-sub-column.guest { border-top-color: var(--accent-guest); }

        .player-buttons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 pulsanti per riga per ogni squadra */
            gap: 6px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 2px;
        }

        /* IL SINGOLO PULSANTE GIOCATORE */
        .player-grid-btn {
            background: #090d16;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s ease;
        }
        .player-grid-btn:active { transform: scale(0.94); background: #1f2937; }

        .p-btn-top {
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
            justify-content: center;
        }
        .p-btn-num {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-gold);
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            font-weight: 900;
            padding: 1px 4px;
            border-radius: 4px;
        }
        .p-btn-name {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 65px;
        }
        .p-btn-stats {
            display: flex;
            gap: 6px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
        }

        /* MODALE POPUP */
        .modal-backdrop {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(6px); z-index: 999; display: none; align-items: flex-end; justify-content: center;
        }
        .modal-backdrop.open { display: flex; }
        .modal-sheet {
            background: var(--bg-card); width: 100%; max-width: 500px; border-top-left-radius: 24px; border-top-right-radius: 24px; border-top: 3px solid var(--accent-gold); padding: 20px 18px 30px 18px; display: flex; flex-direction: column; gap: 12px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .modal-player-name { font-size: 17px; font-weight: 900; text-transform: uppercase; color: #fff; }
        .modal-player-sub { font-size: 11px; color: var(--accent-gold); font-weight: 700; }
        .btn-close-modal { background: #334155; color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; font-weight: 900; }
        .modal-big-btn { padding: 16px 10px; font-size: 15px; border-radius: 10px; }

        /* REGIA TV & CONFIG */
        .team-input-group { display: flex; gap: 6px; }
        .team-input-group input { flex: 1; background: #030712; border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 13px; outline: none; }
        .btn-apply-team { background: var(--accent-gold); color: #030712; border: none; padding: 0 14px; border-radius: 8px; font-weight: 900; font-size: 11px; text-transform: uppercase; }
        .color-selector-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .btn-color { border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; padding: 10px 2px; font-size: 9px; font-weight: 900; text-transform: uppercase; }

        /* BARRA INFERIORE */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: rgba(17, 24, 39, 0.98); backdrop-filter: blur(12px); border-top: 1px solid var(--border-color); display: grid; grid-template-columns: repeat(3, 1fr); z-index: 200;
        }
        .nav-item { background: transparent; border: none; color: var(--text-muted); font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 900; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
        .nav-item.active { color: var(--accent-gold); border-top: 3px solid var(--accent-gold); background: rgba(245, 158, 11, 0.08); }
        .upload-box { background: #030712; border: 1px dashed var(--border-color); padding: 8px; border-radius: 8px; font-size: 10px; }
        .upload-box input { margin-top: 2px; width: 100%; color: var(--text-muted); font-size: 9px; }
    </style>
</head>
<body>

    <!-- BARRA SUPERIORE -->
    <div class="sticky-top-bar">
        <div class="top-timer-row">
            <button class="btn-master-timer" onclick="sendCmd('toggle')">⏯ AVVIA / STOP</button>
            <button class="btn-top-sub gold" onclick="sendCmd('period')">QUARTO +1</button>
            <button class="btn-top-sub" onclick="sendCmd('reset_time')">RESET 10M</button>
        </div>
    </div>

    <!-- SCHEDA 1: PARTITA -->
    <div id="tab-match" class="tab-content active">
        <div class="card">
            <div class="card-title"><span>Gestione Punti & Falli In Diretta</span></div>
            <div class="dual-teams-container">
                <div class="team-column home">
                    <div class="team-col-header" id="lbl-title-h" style="color:var(--accent-home);">CASA</div>
                    <div class="grid-compact-3">
                        <button class="btn-compact home-bg" onclick="sendCmd('h1')">+1</button>
                        <button class="btn-compact home-bg" onclick="sendCmd('h2')">+2</button>
                        <button class="btn-compact home-bg" onclick="sendCmd('h3')">+3</button>
                    </div>
                    <div class="grid-compact-2">
                        <button class="btn-compact home-bg" onclick="sendCmd('hf')">+ Fallo</button>
                        <button class="btn-compact danger-bg" onclick="sendCmd('h-f')">- Fallo</button>
                    </div>
                    <button class="btn-compact" onclick="sendCmd('h-1')">Rimuovi Punto (-1)</button>
                </div>

                <div class="team-column guest">
                    <div class="team-col-header" id="lbl-title-g" style="color:var(--accent-guest);">OSPITI</div>
                    <div class="grid-compact-3">
                        <button class="btn-compact guest-bg" onclick="sendCmd('g1')">+1</button>
                        <button class="btn-compact guest-bg" onclick="sendCmd('g2')">+2</button>
                        <button class="btn-compact guest-bg" onclick="sendCmd('g3')">+3</button>
                    </div>
                    <div class="grid-compact-2">
                        <button class="btn-compact guest-bg" onclick="sendCmd('gf')">+ Fallo</button>
                        <button class="btn-compact danger-bg" onclick="sendCmd('g-f')">- Fallo</button>
                    </div>
                    <button class="btn-compact" onclick="sendCmd('g-1')">Rimuovi Punto (-1)</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Controlli Rapidi Tabellone</div>
            <div class="grid-2">
                <button class="btn btn-warning" style="font-size:11px;" onclick="toggleScoreboardVisibility()">MOSTRA/NASCONDI BUG</button>
                <button class="btn btn-blue" style="font-size:11px;" onclick="toggleTimeVisibility()">MOSTRA/NASCONDI TEMPO</button>
            </div>
            <button class="btn btn-danger" onclick="sendCmd('rf')">AZZERA FALLI ENTRAMBE LE SQUADRE</button>
        </div>
    </div>

    <!-- SCHEDA 2: ENTRAMBI I ROSTER A PULSANTI -->
    <div id="tab-roster" class="tab-content">
        <div class="card">
            <div class="card-title">
                <span>Roster a Pulsanti (Tocca Giocatore)</span>
                <button class="btn-apply-team" style="padding:4px 8px;" onclick="sendCmd('toggle_roster_graphic')">📺 TV</button>
            </div>

            <div class="dual-rosters-grid">
                
                <!-- Colonna Roster Casa -->
                <div class="roster-sub-column home">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                        <span style="font-size:10px; font-weight:900; color:var(--accent-home);" id="roster-lbl-h">CASA</span>
                        <button style="font-size:9px; background:none; border:none; color:var(--text-muted); cursor:pointer;" onclick="resetRosterStats('home')">Reset</button>
                    </div>
                    <div id="player-buttons-grid-home" class="player-buttons-grid">
                        <div style="text-align:center; color:var(--text-muted); padding:10px; font-size:10px; grid-column: span 2;">Nessun roster.</div>
                    </div>
                    <div class="upload-box" style="margin-top:6px;">
                        <strong>JSON Casa:</strong>
                        <input type="file" accept=".json" onchange="importRosterJSON('home', event)">
                    </div>
                </div>

                <!-- Colonna Roster Ospiti -->
                <div class="roster-sub-column guest">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                        <span style="font-size:10px; font-weight:900; color:var(--accent-guest);" id="roster-lbl-g">OSPITI</span>
                        <button style="font-size:9px; background:none; border:none; color:var(--text-muted); cursor:pointer;" onclick="resetRosterStats('guest')">Reset</button>
                    </div>
                    <div id="player-buttons-grid-guest" class="player-buttons-grid">
                        <div style="text-align:center; color:var(--text-muted); padding:10px; font-size:10px; grid-column: span 2;">Nessun roster.</div>
                    </div>
                    <div class="upload-box" style="margin-top:6px;">
                        <strong>JSON Ospiti:</strong>
                        <input type="file" accept=".json" onchange="importRosterJSON('guest', event)">
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- SCHEDA 3: REGIA TV & CONFIG -->
    <div id="tab-tv" class="tab-content">
        <div class="card">
            <div class="card-title">Schermate TV a Tutto Schermo</div>
            <div class="grid-2">
                <button class="btn" style="font-size:11px;" onclick="sendCmd('show_waiting')">⏳ IN ATTESA</button>
                <button class="btn" style="font-size:11px;" onclick="sendCmd('show_coming_back')">⏸ INTERVALLO (10M)</button>
                <button class="btn" style="font-size:11px;" onclick="sendCmd('show_start')">🏀 INIZIO</button>
                <button class="btn" style="font-size:11px;" onclick="sendCmd('show_end')">🏁 FINALE</button>
            </div>
            <button class="btn btn-danger" style="font-size:11px;" onclick="sendCmd('hide_player_card')">✕ CHIUDI FOTO GIOCATORE</button>
        </div>

        <div class="card">
            <div class="card-title">Sponsor & Pubblicità</div>
            <button class="btn btn-warning" style="font-size:11px;" onclick="sendCmd('toggle_ads_rotation')">▶ AVVIA / FERMA SPONSOR</button>
            <button class="btn btn-danger" style="font-size:11px;" onclick="sendCmd('hide_ad')">✕ NASCONDI SPONSOR</button>
        </div>

        <div class="card">
            <div class="card-title">Nomi e Colori Squadre</div>
            <div class="team-input-group">
                <input type="text" id="input-team-h" value="CASA" placeholder="Nome Casa">
                <button class="btn-apply-team" onclick="updateTeamName('h')">Imposta</button>
            </div>
            <div class="color-selector-row">
                <button class="btn-color" style="background:#ffffff; color:#000;" onclick="sendCmd('set_home_color|bianco')">Bianco</button>
                <button class="btn-color" style="background:#10b981; color:#000;" onclick="sendCmd('set_home_color|verde')">Verde</button>
                <button class="btn-color" style="background:#ff2a5f; color:#fff;" onclick="sendCmd('set_home_color|rosso')">Rosso</button>
                <button class="btn-color" style="background:#00f0ff; color:#000;" onclick="sendCmd('set_home_color|blu')">Blu</button>
                <button class="btn-color" style="background:#fbbf24; color:#000;" onclick="sendCmd('set_home_color|oro')">Oro</button>
            </div>

            <div class="team-input-group" style="margin-top:6px;">
                <input type="text" id="input-team-g" value="OSPITI" placeholder="Nome Ospiti">
                <button class="btn-apply-team" onclick="updateTeamName('g')">Imposta</button>
            </div>
            <div class="color-selector-row">
                <button class="btn-color" style="background:#ffffff; color:#000;" onclick="sendCmd('set_guest_color|bianco')">Bianco</button>
                <button class="btn-color" style="background:#10b981; color:#000;" onclick="sendCmd('set_guest_color|verde')">Verde</button>
                <button class="btn-color" style="background:#ff2a5f; color:#fff;" onclick="sendCmd('set_guest_color|rosso')">Rosso</button>
                <button class="btn-color" style="background:#00f0ff; color:#000;" onclick="sendCmd('set_guest_color|blu')">Blu</button>
                <button class="btn-color" style="background:#fbbf24; color:#000;" onclick="sendCmd('set_guest_color|oro')">Oro</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Posizione Scorebug</div>
            <div class="grid-3" style="display:grid; grid-template-columns:repeat(3,1fr); gap:6px;">
                <button class="btn" style="font-size:10px; padding:8px 2px;" onclick="sendCmd('set_position|pos-top-left')">SX Alto</button>
                <button class="btn" style="font-size:10px; padding:8px 2px;" onclick="sendCmd('set_position|pos-top-center')">Centro Alto</button>
                <button class="btn" style="font-size:10px; padding:8px 2px;" onclick="sendCmd('set_position|pos-top-right')">DX Alto</button>
                <button class="btn" style="font-size:10px; padding:8px 2px;" onclick="sendCmd('set_position|pos-bottom-left')">SX Basso</button>
                <button class="btn" style="font-size:10px; padding:8px 2px;" onclick="sendCmd('set_position|pos-bottom-center')">Centro Basso</button>
                <button class="btn" style="font-size:10px; padding:8px 2px;" onclick="sendCmd('set_position|pos-bottom-right')">DX Basso</button>
            </div>
        </div>
    </div>

    <!-- MODALE POPUP GIOCATORE (CHIUSURA AUTOMATICA) -->
    <div id="player-action-modal" class="modal-backdrop" onclick="closePlayerModal()">
        <div class="modal-sheet" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div>
                    <div id="modal-p-name" class="modal-player-name">#00 GIOCATORE</div>
                    <div id="modal-p-stats" class="modal-player-sub">PTS: 0 | FALLI: 0</div>
                </div>
                <button class="btn-close-modal" onclick="closePlayerModal()">✕</button>
            </div>

            <div class="grid-3" style="display:grid; grid-template-columns:repeat(3,1fr); gap:6px;">
                <button class="btn" style="background:var(--accent-green); color:#030712;" onclick="executePlayerAction('pts', 1)">+1 PT</button>
                <button class="btn" style="background:var(--accent-green); color:#030712;" onclick="executePlayerAction('pts', 2)">+2 PTS</button>
                <button class="btn" style="background:var(--accent-green); color:#030712;" onclick="executePlayerAction('pts', 3)">+3 PTS</button>
            </div>

            <div class="grid-3" style="display:grid; grid-template-columns:repeat(3,1fr); gap:6px;">
                <button class="btn btn-warning" onclick="executePlayerAction('fl', 1)">+ FALLO</button>
                <button class="btn btn-danger" onclick="executePlayerAction('pts', -1)">-1 PT</button>
                <button class="btn btn-danger" onclick="executePlayerAction('fl', -1)">- FALLO</button>
            </div>

            <button class="btn btn-blue modal-big-btn" onclick="executeShowPlayerPhoto()">👁 MOSTRA FOTO IN TV</button>
        </div>
    </div>

    <!-- BARRA INFERIORE -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('tab-match', this)">
            <span>🏀 Partita</span>
        </button>
        <button class="nav-item" onclick="switchTab('tab-roster', this)">
            <span>👥 Roster</span>
        </button>
        <button class="nav-item" onclick="switchTab('tab-tv', this)">
            <span>📺 Regia TV</span>
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxsQHMSVBxtx69bEsvheEDt7sylRxfEQ",
            authDomain: "basket-30626.firebaseapp.com",
            databaseURL: "https://basket-30626-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "basket-30626",
            storageBucket: "basket-30626.firebasestorage.app",
            messagingSenderId: "1060504671681",
            appId: "1:1060504671681:web:66e026850afc70704d8b40"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let scoreboardVisible = true;
        let timeVisible = true;
        let rosterData = { home: [], guest: [] };
        let activeModalTeam = null;
        let activeModalIndex = null;

        window.switchTab = function(tabId, btnEl) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnEl.classList.add('active');
        }

        window.toggleScoreboardVisibility = function() {
            scoreboardVisible = !scoreboardVisible;
            sendCmd(scoreboardVisible ? 'show_score|on' : 'show_score|off');
        }

        window.toggleTimeVisibility = function() {
            timeVisible = !timeVisible;
            sendCmd(timeVisible ? 'show_time|on' : 'show_time|off');
        }

        window.sendCmd = function(cmd) {
            set(ref(db, 'stream_control'), { cmd: cmd, t: Date.now() });
        }

        window.updateTeamName = function(type) {
            const val = document.getElementById(`input-team-${type}`).value.trim();
            document.getElementById(`lbl-title-${type}`).innerText = val.toUpperCase();
            if(type === 'h') document.getElementById('roster-lbl-h').innerText = val.toUpperCase();
            if(type === 'g') document.getElementById('roster-lbl-g').innerText = val.toUpperCase();
            sendCmd(`${type === 'h' ? 'nh' : 'ng'}|` + val);
        }

        async function loadDefaultRosterFiles() {
            try {
                const resHome = await fetch('roster_casa.json');
                if (resHome.ok) { parseAndApplyRoster('home', await resHome.json()); renderPlayerButtons('home'); }
                const resGuest = await fetch('roster_ospiti.json');
                if (resGuest.ok) { parseAndApplyRoster('guest', await resGuest.json()); renderPlayerButtons('guest'); }
                syncRostersToOverlay(false);
            } catch (err) {
                renderPlayerButtons('home'); renderPlayerButtons('guest');
            }
        }

        function parseAndApplyRoster(team, data) {
            if (Array.isArray(data)) {
                rosterData[team] = data.map((p, idx) => ({
                    num: p.num !== undefined ? p.num : idx + 1,
                    name: p.name !== undefined ? p.name : `Giocatore ${idx+1}`,
                    pts: p.pts !== undefined ? p.pts : 0, 
                    fl: p.fl !== undefined ? p.fl : 0
                }));
            }
        }

        function renderPlayerButtons(team) {
            const container = document.getElementById(`player-buttons-grid-${team}`);
            container.innerHTML = '';
            if (!rosterData[team] || rosterData[team].length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:10px; font-size:10px; grid-column: span 2;">Nessun roster.</div>`;
                return;
            }
            rosterData[team].forEach((player, index) => {
                const btn = document.createElement('button');
                btn.className = 'player-grid-btn';
                btn.innerHTML = `
                    <div class="p-btn-top">
                        <span class="p-btn-num">#${player.num}</span>
                        <span class="p-btn-name">${player.name}</span>
                    </div>
                    <div class="p-btn-stats">
                        <span>P:${player.pts}</span>
                        <span style="color:var(--accent-red);">F:${player.fl}</span>
                    </div>
                `;
                btn.onclick = () => openPlayerModal(team, index);
                container.appendChild(btn);
            });
        }

        window.openPlayerModal = function(team, index) {
            activeModalTeam = team;
            activeModalIndex = index;
            const player = rosterData[team][index];
            document.getElementById('modal-p-name').innerText = `#${player.num} - ${player.name}`;
            document.getElementById('modal-p-stats').innerText = `PTS: ${player.pts}  |  FALLI: ${player.fl}`;
            document.getElementById('player-action-modal').classList.add('open');
        }

        window.closePlayerModal = function() {
            document.getElementById('player-action-modal').classList.remove('open');
            activeModalTeam = null; activeModalIndex = null;
        }

        window.executePlayerAction = function(stat, val) {
            if (activeModalTeam === null || activeModalIndex === null) return;
            const teamCode = activeModalTeam === 'home' ? 'h' : 'g';
            let player = rosterData[activeModalTeam][activeModalIndex];

            if (stat === 'pts') {
                if (val > 0) { player.pts += val; sendCmd(`${teamCode}${val}`); }
                else { player.pts = Math.max(0, player.pts + val); sendCmd(`${teamCode}-1`); }
            } else if (stat === 'fl') {
                if (val > 0) { player.fl += val; sendCmd(`${teamCode}f`); }
                else { player.fl = Math.max(0, player.fl + val); sendCmd(`${teamCode}-f`); }
            }
            renderPlayerButtons(activeModalTeam);
            syncRostersToOverlay(false);
            closePlayerModal();
        }

        window.executeShowPlayerPhoto = function() {
            if (activeModalTeam === null || activeModalIndex === null) return;
            const player = rosterData[activeModalTeam][activeModalIndex];
            const teamName = document.getElementById(`input-team-${activeModalTeam === 'home' ? 'h' : 'g'}`).value;
            sendCmd(`show_player_card|` + JSON.stringify({ num: player.num, name: player.name, pts: player.pts, fl: player.fl, teamName: teamName.toUpperCase() }));
            closePlayerModal();
        }

        window.resetRosterStats = function(team) {
            if (confirm(`Azzerare punti e falli del roster ${team.toUpperCase()}?`)) {
                rosterData[team].forEach(p => { p.pts = 0; p.fl = 0; });
                renderPlayerButtons(team);
                syncRostersToOverlay(false);
            }
        }

        window.importRosterJSON = function(team, event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    parseAndApplyRoster(team, JSON.parse(e.target.result));
                    renderPlayerButtons(team);
                    syncRostersToOverlay(false);
                    alert(`Roster ${team.toUpperCase()} caricato!`);
                } catch (err) { alert("Errore nel file JSON."); }
            };
            reader.readAsText(file);
        }

        window.syncRostersToOverlay = function(showAlert = true) {
            set(ref(db, 'stream_rosters'), { cmd: 'sync_rosters', rosters: rosterData, t: Date.now() });
            if (showAlert) alert("Roster sincronizzati!");
        }

        window.onload = loadDefaultRosterFiles;
    </script>
</body>
</html>
