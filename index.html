<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Overlay Console Mobile</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="mobile-container">
    <!-- Header superiore -->
    <header class="mobile-header">
      <div class="logo">
        <i class="fa-solid fa-layer-group"></i>
        <span>Overlay Mobile</span>
      </div>
      <button class="icon-btn" id="refresh-btn"><i class="fa-solid fa-rotate-right"></i></button>
    </header>

    <!-- Contenuto principale -->
    <main class="mobile-content">
      <section class="stats-grid">
        <div class="stat-card">
          <span class="stat-title">Attivi</span>
          <span class="stat-value" id="active-count">3</span>
        </div>
        <div class="stat-card">
          <span class="stat-title">FPS / Hz</span>
          <span class="stat-value">60</span>
        </div>
      </section>

      <section class="content-panel">
        <div class="panel-header">
          <h2>I tuoi Overlay</h2>
          <button class="btn-sm btn-primary" id="new-overlay-btn"><i class="fa-solid fa-plus"></i> Nuovo</button>
        </div>
        <div class="cards-list" id="overlay-list">
          <!-- Inserito dinamicamente via JS -->
        </div>
      </section>
    </main>

    <!-- Barra di navigazione inferiore (ottima per smartphone) -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="home"><i class="fa-solid fa-house"></i><span>Home</span></button>
      <button class="nav-item" data-tab="overlays"><i class="fa-solid fa-clone"></i><span>Overlay</span></button>
      <button class="nav-item" data-tab="settings"><i class="fa-solid fa-gear"></i><span>Impostazioni</span></button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
